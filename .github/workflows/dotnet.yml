name: .NET Controller Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          **/bin
          **/obj

  test-controllers:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: ./

    - name: Run tests with coverage
      run: >
        dotnet test MeasureAPI.csproj
        --no-build --configuration Release
        /p:CollectCoverage=true
        /p:CoverletOutput=./TestResults/coverage.cobertura.xml
        /p:CoverletOutputFormat="cobertura"

    - name: Generate coverage report
      run: |
        ~/.dotnet/tools/reportgenerator \
          -reports:"./TestResults/coverage.cobertura.xml" \
          -targetdir:"coverage-report" \
          -reporttypes:"HtmlInline_AzurePipelines;MarkdownSummary" \
          -classfilters:"+*Controller*;-*Model*;-*Migration*"

    - name: Add coverage summary to PR
      if: github.event_name == 'pull_request'
      run: |
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        cat coverage-report/Summary.md >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: controller-coverage-report
        path: coverage-report
